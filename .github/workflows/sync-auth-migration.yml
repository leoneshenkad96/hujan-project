name: Generate Auth Session Migration (one time)
on:
  push:
    branches: ['feature/04-auth-rbac']
    paths:
      - '.github/workflows/sync-auth-migration.yml'
permissions:
  contents: write
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate migration against current snapshot
        run: |
          npm run db:generate
          git status --short drizzle
      - name: Commit generated SQL and snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drizzle
          git diff --staged --quiet && exit 0
          git commit -m "chore(auth): generate database session migration"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/feature/04-auth-rbac
