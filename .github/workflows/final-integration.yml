name: Final Integration CI — No Deploy
on:
  push:
    branches: ['integration/final-uat']
  pull_request:
    branches: ['feature/16-release-readiness']
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Release preflight (read-only)
        run: node scripts/release-preflight.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Integrated security, finance and workflow tests
        run: npm test
      - name: Next.js production build
        run: npm run build
      - name: Drizzle schema integrity
        run: npm run db:check
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate canonical activation migration
        run: npm run db:generate
      - name: Commit generated migration to UAT branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drizzle
          git diff --staged --quiet && exit 0
          git commit -m "chore(uat): add activation token migration"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/integration/final-uat
