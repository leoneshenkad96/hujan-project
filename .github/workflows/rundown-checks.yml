name: Rundown PR Checks
on:
  push:
    branches: ['feature/10-rundown-show']
  pull_request:
    branches: ['feature/09-budget-rab']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:check
      - name: Verify canonical migration is checked in
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
