name: Authentication PR Checks
on:
  push:
    branches: ['feature/04-auth-rbac']
  pull_request:
    branches: ['feature/03-neon-drizzle-schema']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Next.js build
        run: npm run build
      - name: Drizzle schema integrity
        run: npm run db:check
