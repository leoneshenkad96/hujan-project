name: QA Security Checks
on:
  push:
    branches: ['feature/15-qa-security-hardening']
  pull_request:
    branches: ['feature/14-dashboard-reporting']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Security and regression unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Schema integrity
        run: npm run db:check
