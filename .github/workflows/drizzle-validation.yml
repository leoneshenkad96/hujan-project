name: Validate and Generate Drizzle Schema

on:
  push:
    branches: ['feature/03-neon-drizzle-schema']
  pull_request:
    branches: ['feature/02-interactive-ui']

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Generate canonical migration and snapshot
        run: |
          rm -rf drizzle
          npm run db:generate
          test -f drizzle/meta/_journal.json
          test -n "$(find drizzle -name '*.sql' -print -quit)"
      - name: Upload generated schema files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzle-canonical-artifacts
          path: drizzle/
          if-no-files-found: error
