name: Release Readiness Checks
on:
  push:
    branches: ['feature/16-release-readiness']
  pull_request:
    branches: ['feature/15-qa-security-hardening']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Static release preflight
        run: node scripts/release-preflight.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Security, finance and release regression tests
        run: npm test
      - name: Next.js build
        run: npm run build
      - name: Schema consistency
        run: npm run db:check
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
