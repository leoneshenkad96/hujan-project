name: Sync generated Drizzle schema once

on:
  push:
    branches: ['feature/03-neon-drizzle-schema']
    paths:
      - '.github/workflows/sync-drizzle-once.yml'

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install packages without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate canonical SQL and snapshot
        run: |
          rm -rf drizzle
          npm run db:generate
          test -f drizzle/meta/0000_snapshot.json
      - name: Commit generated migration files to this branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A drizzle
          git diff --staged --quiet && exit 0
          git commit -m "chore(db): commit canonical Drizzle SQL and snapshot"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/feature/03-neon-drizzle-schema
